#    python -m h1_rl.train   --config config/h1_walk_teacher.yaml --run-name teacher
#    python -m h1_rl.distill --teacher logs/h1_walk/teacher/model_4000.pt
# =============================================================================
base: h1_walk.yaml

ppo:
  privileged_actor: true
  max_iterations: 4000
