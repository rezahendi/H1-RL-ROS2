name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (no ROS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # MuJoCo only builds models here, it never opens a window, so no display is needed.
      - name: Run the test suite
        run: pytest -q

      - name: Evaluate the shipped policy against its published gates
        run: python -m h1_rl.eval --quick --check --jobs 2 --markdown "$GITHUB_STEP_SUMMARY"
        working-directory: src/h1_rl
